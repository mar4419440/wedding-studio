name: Deploy Static Export to InfinityFree

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Build & Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4
      
    - name: ⚙️ Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        
    - name: 📦 Install dependencies
      run: npm install

    - name: 🏗️ Build Static HTML Site
      # We ignore the build error to force the export of whatever static files successfully compiled
      run: npm run build || true
      
    - name: 📂 Sync files via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ftpupload.net # User's FTP server from InfinityFree
        username: if0_42755715
        password: ${{ secrets.FTP_PASSWORD }}
        port: 21
        local-dir: ./out/
        server-dir: /htdocs/
        exclude: |
          **/.git*
          **/.git*/**
